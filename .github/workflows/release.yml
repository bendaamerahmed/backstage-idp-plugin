# Release. Triggered by pushing a tag, never by a push to main.
#
# A release is a human decision. CI's job is to make it reproducible, not to
# make it automatic — see CONTRIBUTING.md "Releasing" for the steps that come
# before the tag.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for'
        required: true

permissions:
  contents: read

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install the Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Full suite
        env:
          CLAUDE_CLI_REQUIRED: '1'
        run: npm test

      - name: Prove the rules can fail
        run: node scripts/mutation-check.mjs

      - name: Release gate
        # Fails while any item in OPEN-DECISIONS.md is unresolved. A placeholder
        # owner or repository slug in a published artifact is not a cosmetic
        # problem: it is a security contact that goes nowhere and a marketplace
        # entry pointing at a repository that does not exist.
        run: npm run check:release-gate

      - name: Tag matches the manifests
        run: node scripts/release-gate.mjs --check-tag "${{ inputs.tag || github.ref_name }}"

  publish:
    name: build and publish
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the plugin bundle
        run: npm run build:plugin

      - name: Extract release notes from the changelog
        id: notes
        run: node scripts/release-notes.mjs "${{ inputs.tag || github.ref_name }}" > release-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backstage-idp-plugin
          path: dist/*.plugin
          if-no-files-found: error

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: dist/*.plugin
          fail_on_unmatched_files: true
          # The marketplace entry lives in this repository at
          # .claude-plugin/marketplace.json and is served from the default
          # branch, so publishing the release IS publishing the entry — provided
          # the tag was cut from main. The gate above checks that the version in
          # every manifest matches the tag.
          make_latest: true

  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      # Required for npm provenance: npm verifies the package was built by this
      # workflow, from this commit, so a consumer can check where it came from
      # without trusting the publisher's laptop.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Node 24, not 22, specifically for this job. npm's trusted publishing
          # requires "npm CLI version 11.5.1 or later and Node version 22.14.0
          # or higher" (docs.npmjs.com/trusted-publishers). Node 22 satisfies the
          # Node floor but bundles npm 10.9.8, which does not support OIDC at
          # all — the publish fails with an auth error that says nothing about
          # the npm version. Node 24 bundles npm 11.17.0.
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Assert npm is new enough for trusted publishing
        # Fails with the actual reason rather than letting `npm publish` report a
        # generic auth error twenty lines later.
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node -e '
            const [maj, min, patch] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} cannot use OIDC trusted publishing; 11.5.1+ is required.`);
              console.error("Either raise node-version, or add: npm install -g npm@latest");
              process.exit(1);
            }
          ' "$NPM_VERSION"

      - run: npm ci

      - name: Stage the npm package
        # Reads the version from the plugin manifest; the gate above already
        # asserted that matches the tag.
        run: npm run build:npm

      - name: Refuse to republish an existing version
        # npm rejects this anyway, but with an error about the registry rather
        # than about the mistake. A tag re-cut on the same version is the
        # realistic case and this says so.
        run: |
          NAME=$(node -p "require('./dist/npm/package.json').name")
          VERSION=$(node -p "require('./dist/npm/package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published."
            echo "npm versions are immutable. Bump with scripts/set-version.mjs and cut a new tag."
            exit 1
          fi
          echo "$NAME@$VERSION is not yet published; continuing."

      - name: Publish
        # No NODE_AUTH_TOKEN. Authentication is OIDC: the npm CLI detects the
        # trusted-publisher environment and exchanges the workflow's id-token for
        # a short-lived credential, so there is no long-lived token to leak or
        # rotate. Setting NODE_AUTH_TOKEN to an unset secret produces an empty
        # string, which is worse than absent — it looks like a configured token.
        #
        # --provenance IS required. Trusted publishing authenticates the
        # publish; it does not by itself attest it. `npm config get provenance`
        # is `false` by default, and v1.2.1 shipped without an attestation
        # because this flag had been removed on the assumption that OIDC implied
        # it. It does not.
        #
        # Requires the trusted publisher on npmjs.com to name THIS file
        # (release.yml) with "Allow npm publish" enabled.
        run: npm publish ./dist/npm --access public --provenance
